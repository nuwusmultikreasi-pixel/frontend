{% load static dinezy %}{% dz_splash as sp %}{% if sp %}
<div class="dz-splash" id="dzSplash" aria-hidden="true">
    <div class="sp-glow"></div>
    <div class="sp-center">
        <div class="sp-logo">
            <span class="sp-ring r1"></span><span class="sp-ring r2"></span>
            <img src="{% static 'core/img/dinezy-mark-white.png' %}" alt="">
        </div>
        <div class="sp-text">
            <small>{{ sp.cafe }}</small>
            <b>Selamat datang, {{ sp.nama }}</b>
            <span class="sp-bar"><i></i></span>
        </div>
    </div>
</div>
<script>
(function () {
    const s = document.getElementById('dzSplash'); if (!s) return;
    document.documentElement.classList.add('splash-on');
    const done = () => { if (s.classList.contains('out')) return; s.classList.add('out'); document.documentElement.classList.remove('splash-on'); document.documentElement.classList.add('splash-reveal'); setTimeout(() => { s.remove(); document.documentElement.classList.remove('splash-reveal'); }, 900); };
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(done, reduce ? 300 : 1750);
    s.addEventListener('click', done);
})();
</script>
{% endif %}
