{% load static %}<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses Ditolak — Dinezy</title>
    {% include 'partials/favicon.html' %}
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'core/dinezy.css' %}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;background:#f7faff">
    <div class="dz-card p-5 text-center" style="max-width:440px">
        <img src="{% static 'core/img/dinezy-mark-navy.png' %}" class="dz-mark dz-mark-lg mx-auto mb-4" alt="Logo Dinezy">
        <div class="dz-empty p-0"><div class="ico" style="background:#fee2e2;color:#dc2626"><i class="fas fa-lock"></i></div></div>
        <h4 class="mb-2">Akses Ditolak</h4>
        <p class="text-muted mb-4">{{ pesan }}</p>
        <a href="/logout/" class="btn btn-dz w-100">Masuk dengan akun lain</a>
    </div>
</body>
</html>
